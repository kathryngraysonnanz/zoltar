<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Epson TM-m30III Printer Demo</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="panel hero">
        <p class="eyebrow">Epson TM-m30III</p>
        <h1>Print a sample receipt from the browser.</h1>
        <p class="lede">
          This web app sends a sample ESC/POS receipt through a Node server to your printer over Wi-Fi.
        </p>
      </section>

      <section class="panel form-panel">
        <form id="print-form" class="stack">
          <p class="target">
            Locked printer target: <strong>192.168.1.121:9100</strong> and ePOS device
            <strong>local_printer</strong>.
          </p>

          <label>
            <span>ePOS timeout (ms)</span>
            <input id="epos-timeout" name="timeout" type="number" min="1" max="300000" value="60000">
          </label>

          <div class="actions">
            <button type="button" id="test-connection">Test connection</button>
            <button type="submit">Print sample receipt</button>
            <button type="button" id="print-epos">Print via Epson ePOS</button>
          </div>
        </form>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
